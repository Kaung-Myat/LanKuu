name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "desktop/**"
      - "android/**"

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LanKuu-0.5.2-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop:
    name: Desktop · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
            targets: ""
            artifact: LanKuu-0.5.2-Ubuntu-x64
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - label: Windows x64
            os: windows-latest
            args: --bundles nsis
            targets: ""
            artifact: LanKuu-0.5.2-Windows-x64
            files: target/release/bundle/nsis/*.exe
          - label: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin
            artifact: LanKuu-0.5.2-macOS-Apple-Silicon
            files: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            targets: x86_64-apple-darwin
            artifact: LanKuu-0.5.2-macOS-Intel
            files: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop/src-tauri
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
